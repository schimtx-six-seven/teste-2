<style>
:root{--navy:#17212f;--navy2:#223247;--ink:#25303a;--white:#fffdf8;--muted:#7c7f7d;--line:#b7a898;--mint:#71b7a0;--cyan:#6da7ba;--yellow:#e5ae58;--coral:#d87863;--violet:#8d82b7;--panel:#fffaf2;--panelLine:#e5d8ca;--shadow:0 15px 35px #452d1f24}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1421;color:var(--white);font-family:Avenir Next,Segoe UI,Trebuchet MS,ui-sans-serif,sans-serif}button,input{font:inherit}button{cursor:pointer}.game{width:min(620px,100%);min-height:100vh;margin:auto;background:var(--navy);position:relative;overflow:hidden}.topbar{height:82px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#fffdf8,#f5eadf);border-bottom:2px solid #b7a898;position:absolute;z-index:4;inset:0 0 auto}.top-left{display:flex;align-items:center;gap:9px}.logo-mark{width:38px;height:38px;border:2px solid var(--cyan);border-radius:12px;position:relative;background:#16304a;box-shadow:0 0 20px #54ccef33}.logo-mark:before,.logo-mark:after{content:'';position:absolute;background:var(--cyan);transform:skewY(-25deg)}.logo-mark:before{width:5px;height:20px;left:10px;top:8px}.logo-mark:after{width:5px;height:14px;right:10px;top:13px}.company{font-size:15px;font-weight:900;color:#3d3230;letter-spacing:-.02em}.colony{font-size:10px;color:#8c7770;margin-top:3px}.cash{text-align:right}.cash b{display:block;color:#39816e;font-size:17px;letter-spacing:-.03em}.cash small{color:#8c7770;font-size:9px}.map-wrap{position:absolute;inset:0 0 73px;overflow:hidden;background:#8cc5ba}.map-canvas{display:block;width:100%;height:100%;touch-action:none}.map-hint{position:absolute;top:94px;left:13px;padding:7px 9px;border:1px solid #d9f5e988;background:#112b3acc;border-radius:10px;color:#dcf9f3;font-size:10px;pointer-events:none;backdrop-filter:blur(6px)}.resource-strip{position:absolute;top:94px;right:13px;display:flex;gap:5px;pointer-events:none}.pill{background:#122941dc;border:1px solid #6e94b077;border-radius:10px;padding:6px 8px;font-size:10px;color:#daeaf7}.pill b{color:var(--yellow)}.bottom{position:absolute;z-index:5;left:0;right:0;bottom:0;height:76px;background:#fffaf2f2;border-top:2px solid #b7a898;display:grid;grid-template-columns:repeat(6,1fr);padding:7px 5px calc(7px + env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav-btn{border:0;background:transparent;color:#897a70;font-size:9px;font-weight:900;padding:3px 1px}.nav-icon{width:25px;height:24px;margin:auto auto 3px;display:block}.nav-btn.active{color:#b85f4f}.nav-btn.active .nav-icon{filter:drop-shadow(0 0 5px #69c9ee99)}.modal-back{position:absolute;z-index:10;inset:0;background:#081321b8;display:none;align-items:flex-end;justify-content:center}.modal-back.open{display:flex}.sheet{width:100%;max-height:85%;overflow:auto;background:var(--panel);color:var(--ink);border-radius:26px 26px 0 0;border:1px solid #fff;padding:18px 15px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px #06101d77}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sheet h2{font-size:20px;margin:0;letter-spacing:-.03em}.close{width:32px;height:32px;border:0;border-radius:10px;background:#e7edf4;color:#536679;font-size:20px}.sheet-sub{font-size:11px;color:#718296;margin-top:4px}.card{background:#fff;border:1px solid var(--panelLine);border-radius:14px;padding:13px;margin:10px 0;box-shadow:0 5px 15px #17283b0d}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-weight:900;font-size:13px}.muted{font-size:11px;color:#718296;line-height:1.4;margin-top:3px}.value{font-weight:900;font-size:18px;color:#192b40}.btn{border:2px solid #3f4d56;border-radius:13px;padding:10px 12px;background:#344550;color:#fff;font-size:11px;font-weight:900}.btn.primary{background:#6da7ba;color:#102733;border-color:#486d78}.btn.good{background:#71b7a0;color:#17382f;border-color:#477b6a}.btn.warn{background:#e5ae58;color:#35260c;border-color:#a87833}.btn.full{width:100%;margin-top:8px}.bar{height:8px;border-radius:8px;background:#e5ebf1;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--mint));border-radius:8px;transition:width .3s}.business-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.biz-card{padding:11px;border:1px solid var(--panelLine);border-radius:12px;background:#fff}.biz-card b{display:block;font-size:12px}.biz-card small{display:block;color:#718296;font-size:10px;margin:4px 0}.biz-dot{height:8px;width:8px;border-radius:50%;display:inline-block;background:var(--mint);margin-right:4px}.locked{background:#edf1f5!important;color:#8090a1}.locked b{color:#718296}.rank{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid #e5eaf0;align-items:center}.rank:last-child{border:0}.rank strong{color:#4f6b84}.rank b{font-size:12px}.rank small{display:block;color:#8090a1;font-size:10px}.rank span{font-size:11px;font-weight:900;color:#287c76}.menu-cover{position:absolute;z-index:20;inset:0;background:linear-gradient(160deg,#152d47,#0e1929 62%,#0b1421);display:flex;align-items:center;justify-content:center;padding:20px}.menu-card{width:min(430px,100%);background:#f6f8fb;color:var(--ink);border-radius:22px;padding:18px;box-shadow:var(--shadow)}.menu-art{height:170px;background:linear-gradient(180deg,#74c5d0,#eaa270);border-radius:15px;overflow:hidden;margin:-4px -4px 15px}.menu-art canvas{width:100%;height:100%;display:block}.menu-card h1{font-size:32px;margin:0;color:#e96062;letter-spacing:-.07em}.menu-card p{color:#718296;font-size:12px;line-height:1.45}.field{margin:9px 0}.field label{font-weight:900;color:#718296;font-size:9px;display:block;margin-bottom:4px}.field input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:var(--ink);outline:none}.menu-btn{width:100%;border:0;border-radius:11px;padding:12px;margin-top:8px;font-weight:900;background:var(--navy);color:#fff}.menu-btn.alt{background:#e7edf4;color:#30465c}.offline{position:absolute;z-index:30;inset:0;background:#071321aa;display:none;align-items:center;justify-content:center;padding:20px}.offline.open{display:flex}.offline-card{width:min(370px,100%);background:#f7fbff;color:var(--ink);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.offline-card h2{margin:0 0 6px}.offline-card p{color:#718296;font-size:12px;line-height:1.45}.toast{position:absolute;z-index:50;top:92px;left:50%;transform:translate(-50%,-80px);background:#071321;color:#fff;border:1px solid #7dd8ee;border-radius:10px;padding:9px 13px;font-size:11px;font-weight:800;transition:.25s;pointer-events:none}.toast.show{transform:translate(-50%,0)}
</style>

<body>
<div class="game" id="game"><header class="topbar"><div class="top-left"><div class="logo-mark"></div><div><div class="company" id="companyLabel">Rask & Coil</div><div class="colony" id="colonyLabel">Dusthaven · reputação 1</div></div></div><div class="cash"><b id="money">US$ 500</b><small><span id="income">US$ 0</span> / segundo</small></div></header><div class="map-wrap"><canvas id="mapCanvas" class="map-canvas" width="900" height="1100"></canvas><div class="map-hint">Arraste para explorar · pinça para zoom</div><div class="resource-strip"><div class="pill">FERRO <b id="ore">0</b></div><div class="pill">REPUTAÇÃO <b id="rep">1</b></div></div></div><nav class="bottom"><button class="nav-btn active" data-panel="businesses" onclick="openPanel('businesses')"><canvas class="nav-icon" width="25" height="24" data-icon="business"></canvas>NEGÓCIOS</button><button class="nav-btn" data-panel="upgrades" onclick="openPanel('upgrades')"><canvas class="nav-icon" width="25" height="24" data-icon="upgrade"></canvas>MELHORIAS</button><button class="nav-btn" data-panel="staff" onclick="openPanel('staff')"><canvas class="nav-icon" width="25" height="24" data-icon="staff"></canvas>FUNCIONÁRIOS</button><button class="nav-btn" data-panel="map" onclick="openPanel('map')"><canvas class="nav-icon" width="25" height="24" data-icon="map"></canvas>MAPA</button><button class="nav-btn" data-panel="ranking" onclick="openPanel('ranking')"><canvas class="nav-icon" width="25" height="24" data-icon="rank"></canvas>RANKING</button><button class="nav-btn" data-panel="menu" onclick="openPanel('menu')"><canvas class="nav-icon" width="25" height="24" data-icon="menu"></canvas>MENU</button></nav><div id="sheetBack" class="modal-back"><section class="sheet" id="sheet"></section></div><div id="offlineBack" class="offline"><div class="offline-card"><h2>Enquanto você estava fora</h2><p id="offlineText">A empresa continuou produzindo.</p><button class="btn primary full" onclick="closeOffline()">CONTINUAR</button></div></div><div id="mainMenu" class="menu-cover"><div class="menu-card"><div class="menu-art"><canvas id="menuCanvas" width="700" height="300"></canvas></div><h1>SPACE TYCOON</h1><p>Um império empresarial começa com um terreno pequeno, uma boa equipe e uma decisão corajosa.</p><div id="newGameFields"><div class="field"><label>SEU APELIDO</label><input id="playerName" placeholder="Nox Calder"></div><div class="field"><label>NOME DA EMPRESA</label><input id="companyName" placeholder="Rask & Coil"></div><div class="field"><label>NOME DA COLÔNIA</label><input id="colonyName" placeholder="Dusthaven"></div></div><button class="menu-btn" onclick="startGame()">JOGAR</button><button class="menu-btn alt" onclick="showMenu('tutorial')">TUTORIAL</button><button class="menu-btn alt" onclick="showMenu('settings')">CONFIGURAÇÕES</button><div id="menuInfo" style="display:none"></div></div></div></div>
<script>
const KEY='space_tycoon_quality_v1';let game=null,last=Date.now(),toastTimer,audioCtx=null,musicTimer=null,musicStep=0,audio={music:true,sfx:true};const cam={x:0,y:80,zoom:1};const MAP_LIMIT={left:-280,right:280,top:-230,bottom:270};let drag=null,pinch=null;function clampCamera(){cam.x=Math.max(MAP_LIMIT.left*cam.zoom,Math.min(MAP_LIMIT.right*cam.zoom,cam.x));cam.y=Math.max(MAP_LIMIT.top*cam.zoom,Math.min(MAP_LIMIT.bottom*cam.zoom,cam.y))}const businesses=[{id:'mine',name:'Red Mountains',kind:'Extração',x:310,y:290,color:'#dc7663',base:3,level:1,staff:1},{id:'foundry',name:'Copperline Works',kind:'Fábrica',x:570,y:430,color:'#69b8c4',base:8,level:1,staff:0},{id:'office',name:'Northstar Bureau',kind:'Escritório',x:350,y:580,color:'#9c8bea',base:5,level:1,staff:0}];const locked=[{id:'lotA',x:770,y:250,need:'US$ 5.000'},{id:'lotB',x:790,y:600,need:'Reputação 3'},{id:'lotC',x:180,y:720,need:'2 negócios nível 3'}];const fresh=()=>({money:500,ore:0,rep:1,startedAt:Date.now(),lastSave:Date.now(),playSeconds:0,player:'Nox Calder',company:'Rask & Coil',colony:'Dusthaven',language:'pt',businesses:JSON.parse(JSON.stringify(businesses)),unlocked:[],floats:[],particles:[]});function fmt(n){if(n>=1e9)return(n/1e9).toFixed(1)+' bi';if(n>=1e6)return(n/1e6).toFixed(1)+' mi';if(n>=1e3)return(n/1e3).toFixed(1)+'k';return Math.floor(n).toLocaleString('pt-BR')}function money(n){return'US$ '+fmt(n)}function income(){return game.businesses.reduce((a,b)=>a+b.base*b.level*(1+b.staff*.12),0)}function project(wx,wy){return{x:450+(wx-wy)*.86*cam.zoom+cam.x,y:235+(wx+wy)*.43*cam.zoom+cam.y}}function unproject(sx,sy){const a=(sx-450-cam.x)/(.86*cam.zoom),b=(sy-235-cam.y)/(.43*cam.zoom);return{x:(a+b)/2,y:(b-a)/2}}function poly(c,pts,fill,stroke='#203246',lw=2){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));c.closePath();c.fillStyle=fill;c.fill();c.strokeStyle=stroke;c.lineWidth=lw;c.stroke()}function isoBox(c,wx,wy,w,h,d,color){const p=project(wx,wy),q=project(wx+w,wy),r=project(wx+w,wy+h),s=project(wx,wy+h);const top=[{x:p.x,y:p.y-d},{x:q.x,y:q.y-d},{x:r.x,y:r.y-d},{x:s.x,y:s.y-d}];poly(c,top,light(color));poly(c,[top[1],top[2],{x:r.x,y:r.y},{x:q.x,y:q.y}],dark(color));poly(c,[top[2],top[3],{x:s.x,y:s.y},{x:r.x,y:r.y}],color);return{p,q,r,s,top}}function light(hex){return hex+'cc'}function dark(hex){return hex+'99'}function drawMineBuilding(c,b){const p=project(b.x,b.y),z=cam.zoom,sc=1+b.level*.12;const base={x:p.x,y:p.y};c.save();c.fillStyle='#61483d44';c.beginPath();c.ellipse(base.x+26*z,base.y+27*z,112*z,35*z,0,0,7);c.fill();const rock=[{x:base.x-72*z,y:base.y-4*z},{x:base.x-45*z,y:base.y-56*z},{x:base.x+4*z,y:base.y-82*z},{x:base.x+78*z,y:base.y-58*z},{x:base.x+92*z,y:base.y+10*z},{x:base.x+38*z,y:base.y+34*z},{x:base.x-40*z,y:base.y+27*z}];poly(c,rock,'#a95f50','#4f3833',3);poly(c,[{x:base.x-37*z,y:base.y+10*z},{x:base.x-23*z,y:base.y-30*z},{x:base.x+32*z,y:base.y-45*z},{x:base.x+59*z,y:base.y+10*z}], '#2e3039','#473532',4);c.fillStyle='#162532';c.beginPath();c.ellipse(base.x+11*z,base.y-9*z,35*z,22*z,0,0,7);c.fill();c.strokeStyle='#1c2028';c.lineWidth=4*z;c.stroke();for(let i=0;i<4;i++){const xx=base.x-75*z+i*52*z,yy=base.y+21*z; c.strokeStyle='#5b3d35';c.lineWidth=4*z;c.beginPath();c.moveTo(xx,yy);c.lineTo(xx+15*z,yy-47*z);c.stroke();c.fillStyle='#d9914e';c.fillRect(xx+9*z,yy-50*z,13*z,8*z)}c.strokeStyle='#2b3037';c.lineWidth=7*z;c.beginPath();c.moveTo(base.x+3*z,base.y-54*z);c.lineTo(base.x+3*z,base.y-153*z*sc);c.moveTo(base.x+39*z,base.y-47*z);c.lineTo(base.x+39*z,base.y-153*z*sc);c.stroke();c.strokeStyle='#59626a';c.lineWidth=3*z;c.beginPath();c.moveTo(base.x-12*z,base.y-143*z*sc);c.lineTo(base.x+54*z,base.y-143*z*sc);c.moveTo(base.x-10*z,base.y-105*z*sc);c.lineTo(base.x+52*z,base.y-105*z*sc);c.stroke();c.fillStyle='#e5ae58';c.fillRect(base.x+7*z,base.y-139*z*sc,29*z,16*z);c.strokeStyle='#4f3833';c.strokeRect(base.x+7*z,base.y-139*z*sc,29*z,16*z);c.fillStyle='#f5d889';c.beginPath();c.arc(base.x+21*z,base.y-131*z*sc,4*z,0,7);c.fill();c.stroke();c.strokeStyle='#2d353e';c.lineWidth=5*z;c.beginPath();c.moveTo(base.x-43*z,base.y-53*z);c.lineTo(base.x-94*z,base.y-91*z);c.lineTo(base.x-147*z,base.y-63*z);c.stroke();c.fillStyle='#4f7e83';c.fillRect(base.x-151*z,base.y-71*z,58*z,17*z);c.strokeStyle='#324047';c.strokeRect(base.x-151*z,base.y-71*z,58*z,17*z);c.fillStyle='#fff1ba';for(let i=0;i<3;i++)c.fillRect(base.x-143*z+i*15*z,base.y-68*z,7*z,7*z);c.fillStyle='#fffdf0';c.font='bold '+Math.max(10,14*z)+'px Avenir Next, sans-serif';c.fillText(b.name,base.x-42*z,base.y-170*z*sc);c.fillStyle='#38434a';c.font='bold '+Math.max(9,11*z)+'px Avenir Next, sans-serif';c.fillText('NÍVEL '+b.level,base.x-38*z,base.y-155*z*sc);c.restore();return{top:[{x:base.x-45*z,y:base.y-85*z},{x:base.x+40*z,y:base.y-85*z},{x:base.x+40*z,y:base.y-20*z},{x:base.x-45*z,y:base.y-20*z}]}}function drawMap(){const c=document.getElementById('mapCanvas'),d=c.getContext('2d'),W=c.width,H=c.height;d.clearRect(0,0,W,H);const bg=d.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#81c9bf');bg.addColorStop(.5,'#b9d3a6');bg.addColorStop(1,'#d4b982');d.fillStyle=bg;d.fillRect(0,0,W,H);for(let gx=-3;gx<12;gx++)for(let gy=-3;gy<12;gy++){const p=project(gx*120,gy*120),q=project((gx+1)*120,gy*120),r=project((gx+1)*120,(gy+1)*120),s=project(gx*120,(gy+1)*120);poly(d,[p,q,r,s],(gx+gy)%2?'#add09f':'#b7d5a5','#91b58f',1)}for(let i=0;i<locked.length;i++){const l=locked[i],p=project(l.x,l.y);poly(d,[{x:p.x,y:p.y-55},{x:p.x+90*cam.zoom,y:p.y-98*cam.zoom},{x:p.x+180*cam.zoom,y:p.y-55},{x:p.x+90*cam.zoom,y:p.y-12}],game.unlocked.includes(l.id)?'#9bcaa9':'#94a8a799','#607d70',2);d.fillStyle='#355467';d.font='bold 13px Arial';d.fillText(game.unlocked.includes(l.id)?'TERRENO LIVRE':'BLOQUEADO',p.x+35,p.y-48);d.font='11px Arial';d.fillText(l.need,p.x+35,p.y-31)}for(const b of game.businesses){const p=project(b.x,b.y);const shadow=project(b.x+40,b.y+35);d.fillStyle='#34505b33';d.beginPath();d.ellipse(shadow.x,shadow.y+4,80*cam.zoom,25*cam.zoom,0,0,7);d.fill();const box=b.id==='mine'?drawMineBuilding(d,b):isoBox(d,b.x,b.y,100+b.level*14,85+b.level*8,75+b.level*13,b.color);d.fillStyle='#fff8e6';d.font='bold 14px Arial';d.fillText(b.name,box.top[3].x-22,box.top[3].y-7);d.fillStyle='#203246';d.font='11px Arial';d.fillText('NÍVEL '+b.level,box.top[3].x+6,box.top[3].y+10);for(let k=0;k<Math.min(4,b.level);k++){const fx=box.top[0].x+25+k*22,fy=box.top[0].y+29;d.fillStyle='#fff3b0';d.fillRect(fx,fy,12,13)}if((Date.now()/500+b.x)%2<1){d.fillStyle='#fff6b0';d.beginPath();d.arc(box.top[1].x-8,box.top[1].y-16,5,0,7);d.fill()}for(let k=0;k<b.staff;k++){const fp=project(b.x+20+k*22,b.y+110);d.fillStyle=k%2?'#354c82':'#bd584d';d.beginPath();d.arc(fp.x,fp.y-13,6,0,7);d.fill();d.fillRect(fp.x-5,fp.y-7,10,12)}d.fillStyle='#fff';d.font='bold 16px Arial';d.fillText('+$'+(b.base*b.level),box.top[0].x+8,box.top[0].y-10)}for(const f of game.floats){const p=project(f.x,f.y);d.globalAlpha=Math.max(0,f.life/1.5);d.fillStyle='#fff6a6';d.font='bold 18px Arial';d.fillText(f.text,p.x,p.y-f.life*25);d.globalAlpha=1}game.floats=game.floats.filter(f=>f.life>0);d.fillStyle='#344f5d';d.font='bold 13px Arial';d.fillText('IMPERIAL DISTRICT // SETOR 01',24,145);requestAnimationFrame(()=>{if(game)drawMap()})}function hitAt(sx,sy){const w=unproject(sx,sy);for(const b of game.businesses){if(Math.abs(w.x-b.x)<115&&Math.abs(w.y-b.y)<115)return{type:'business',data:b}}for(const l of locked){if(Math.abs(w.x-l.x)<150&&Math.abs(w.y-l.y)<150)return{type:'land',data:l}}return null}function openBusiness(b){openSheet(`<div class="sheet-head"><div><h2>${b.name}</h2><div class="sheet-sub">${b.kind} · nível ${b.level}</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="card"><div class="row"><div><div class="title">Produção por segundo</div><div class="muted">A atividade aparece no mapa em tempo real.</div></div><div class="value">US$ ${b.base*b.level}/s</div></div><div class="bar"><i style="width:${Math.min(100,b.level*20)}%"></i></div></div><div class="business-grid"><div class="biz-card"><b>Receita</b><small>${money(b.base*b.level*60)} / min</small></div><div class="biz-card"><b>Funcionários</b><small>${b.staff} alocados</small></div></div><button class="btn primary full" onclick="upgradeBusiness('${b.id}')">MELHORAR · ${money(300*b.level)}</button><button class="btn good full" onclick="staffBusiness('${b.id}')">ALOJAR FUNCIONÁRIO</button>`)}function openPanel(panel){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.panel===panel));if(panel==='businesses')openSheet(`<div class="sheet-head"><div><h2>Negócios</h2><div class="sheet-sub">Toque em uma operação para administrar.</div></div><button class="close" onclick="closeSheet()">×</button></div>${game.businesses.map(b=>`<div class="card" onclick="openBusiness(game.businesses.find(x=>x.id==='${b.id}'))"><div class="row"><div><div class="title"><span class="biz-dot"></span>${b.name}</div><div class="muted">${b.kind} · nível ${b.level}</div></div><b class="value">${money(b.base*b.level)}/s</b></div></div>`).join('')}`);if(panel==='upgrades')openSheet(`<div class="sheet-head"><div><h2>Melhorias</h2><div class="sheet-sub">Faça o mapa crescer com o caixa.</div></div><button class="close" onclick="closeSheet()">×</button></div>${game.businesses.map(b=>`<div class="card"><div class="row"><div><div class="title">${b.name}</div><div class="muted">Nível ${b.level} → ${b.level+1}</div></div><button class="btn primary" onclick="upgradeBusiness('${b.id}')">${money(300*b.level)}</button></div></div>`).join('')}`);if(panel==='staff')openSheet(`<div class="sheet-head"><div><h2>Funcionários</h2><div class="sheet-sub">Pessoas são parte do império.</div></div><button class="close" onclick="closeSheet()">×</button></div><div class="card"><div class="title">Equipe disponível</div><div class="muted">Toque em uma empresa no mapa para alojar funcionários no setor.</div></div>${['Mara Quill','Pip Dorne','Odo Venn'].map((n,i)=>`<div class="card"><div class="row"><div><div class="title">${n}</div><div class="muted">${['Operações','Logística','Finanças'][i]} · eficiência +${10+i*5}%</div></div><button class="btn good" onclick="showToast('Visite um negócio para alojar esta pessoa')">VISITAR</button></div></div>`).join('')}`);if(panel==='map')openSheet(`<div class="sheet-head"><div><h2>Mapa do império</h2><div class="sheet-sub">Novos terrenos aguardam investimento.</div></div><button class="close" onclick="closeSheet()">×</button></div>${locked.map(l=>`<div class="card ${game.unlocked.includes(l.id)?'':'locked'}"><div class="row"><div><div class="title">${game.unlocked.includes(l.id)?'Terreno disponível':'Terreno bloqueado'}</div><div class="muted">Requisito: ${l.need}</div></div><button class="btn ${game.unlocked.includes(l.id)?'good':'warn'}" onclick="unlockLand('${l.id}')">${game.unlocked.includes(l.id)?'ABERTO':'DESBLOQUEAR'}</button></div></div>`).join('')}`);if(panel==='ranking')openSheet(`<div class="sheet-head"><div><h2>Ranking</h2><div class="sheet-sub">As maiores empresas do setor.</div></div><button class="close" onclick="closeSheet()">×</button></div>${[['01','Orbit & Ore','US$ 9,4 bi'],['02','Copper Comet','US$ 8,1 bi'],['03','Morrow Works','US$ 7,6 bi'],['04',game.company,money(game.money)]].map(r=>`<div class="rank"><strong>${r[0]}</strong><div><b>${r[1]}</b><small>colônia verificada</small></div><span>${r[2]}</span></div>`).join('')}`);if(panel==='menu')openSheet(`<div class="sheet-head"><div><h2 data-t="menu">Menu</h2><div class="sheet-sub">Ajustes rápidos da operação.</div></div><button class="close" onclick="closeSheet()">×</button></div><button class="btn full" onclick="showMenu('tutorial')">TUTORIAL</button><button class="btn full" onclick="showMenu('settings')">CONFIGURAÇÕES</button><div class="card"><div class="title">IDIOMA / LANGUAGE / IDIOMA</div><div class="muted">Escolha a língua da interface.</div><div class="row" style="margin-top:9px"><button class="btn primary" onclick="setLanguage('pt')">PORTUGUÊS</button><button class="btn" onclick="setLanguage('en')">ENGLISH</button><button class="btn" onclick="setLanguage('es')">ESPAÑOL</button></div></div><button class="btn warn full" onclick="save();showToast('Progresso salvo neste dispositivo')">SALVAR AGORA</button>`)}function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('sheetBack').classList.add('open')}function closeSheet(){document.getElementById('sheetBack').classList.remove('open')}function upgradeBusiness(id){const b=game.businesses.find(x=>x.id===id),cost=300*b.level;if(game.money<cost)return showToast('Caixa insuficiente');game.money-=cost;b.level++;game.rep++;playClick();showToast(b.name+' cresceu um nível');render();openBusiness(b)}function staffBusiness(id){const b=game.businesses.find(x=>x.id===id);if(game.money<100)return showToast('Contrate depois de gerar mais caixa');game.money-=100;b.staff++;playClick();showToast('Funcionário alojado em '+b.name);render();openBusiness(b)}function unlockLand(id){const l=locked.find(x=>x.id===id);if(game.unlocked.includes(id))return showToast('Terreno já aberto');if((id==='lotA'&&game.money<5000)||(id==='lotB'&&game.rep<3)||(id==='lotC'&&game.businesses.filter(b=>b.level>=3).length<2))return showToast('Requisito ainda não alcançado');if(id==='lotA')game.money-=5000;game.unlocked.push(id);playClick();showToast('Novo terreno incorporado ao império');render();openPanel('map')}function setLanguage(lang){game.language=lang;const words={pt:{nav:['NEGÓCIOS','MELHORIAS','FUNCIONÁRIOS','MAPA','RANKING','MENU'],money:'CAIXA',income:' / segundo'},en:{nav:['BUSINESSES','UPGRADES','STAFF','MAP','RANKING','MENU'],money:'CASH',income:' / second'},es:{nav:['NEGOCIOS','MEJORAS','PERSONAL','MAPA','RANKING','MENÚ'],money:'CAJA',income:' / segundo'}}[lang];document.querySelectorAll('.nav-btn').forEach((b,i)=>{b.childNodes[b.childNodes.length-1].nodeValue=words.nav[i]});const cashSmall=document.querySelector('.cash small');if(cashSmall)cashSmall.innerHTML='<span id="income">'+document.getElementById('income').textContent+'</span>'+words.income;save();showToast(lang==='en'?'Language updated':lang==='es'?'Idioma actualizado':'Idioma atualizado');openPanel('menu')}function render(){if(!game)return;document.getElementById('companyLabel').textContent=game.company;document.getElementById('colonyLabel').textContent=game.colony+' · reputação '+game.rep;document.getElementById('money').textContent=money(game.money);document.getElementById('income').textContent=money(income());document.getElementById('ore').textContent=fmt(game.ore);document.getElementById('rep').textContent=game.rep;drawMap()}function tick(){if(!game)return;const now=Date.now(),dt=Math.min(5,(now-last)/1000);last=now;const earn=income()*dt;game.money+=earn;game.ore+=game.businesses[0].level*dt;game.playSeconds+=dt;for(const b of game.businesses){if(Math.random()<.25){game.floats.push({x:b.x+40,y:b.y,life:1.5,text:'+$'+Math.max(1,Math.floor(b.base*b.level))})}}render();if(now-game.lastSave>5000)save()}function save(){if(game){game.lastSave=Date.now();localStorage.setItem(KEY,JSON.stringify(game))}}function closeOffline(){document.getElementById('offlineBack').classList.remove('open')}function showOffline(seconds,earned){const h=Math.floor(seconds/3600),m=Math.floor(seconds%3600/60);document.getElementById('offlineText').textContent='Você ficou fora por '+h+'h '+m+'min. Sua empresa gerou '+money(earned)+' enquanto você estava fora.';document.getElementById('offlineBack').classList.add('open')}function startGame(){game=fresh();game.player=document.getElementById('playerName').value.trim()||game.player;game.company=document.getElementById('companyName').value.trim()||game.company;game.colony=document.getElementById('colonyName').value.trim()||game.colony;save();document.getElementById('mainMenu').style.display='none';render();initAudio();initInput();startAudio();showToast('Seu império começou')}function boot(){const raw=localStorage.getItem(KEY);drawMenu();drawNavIcons();if(raw){document.getElementById('mainMenu').style.display='none';game=Object.assign(fresh(),JSON.parse(raw));const elapsed=Math.min(8*3600,(Date.now()-game.lastSave)/1000);const earned=income()*elapsed;game.money+=earned;showOffline(elapsed,earned)}else{document.getElementById('mainMenu').style.display='flex'}}function showMenu(kind){const info=document.getElementById('menuInfo');info.style.display='block';info.innerHTML=kind==='tutorial'?'<div class="card"><b>Como jogar</b><div class="muted">Arraste o mapa, use pinça para zoom e toque nos prédios. Cada negócio produz continuamente. Terrenos bloqueados mostram seus requisitos.</div></div><button class="menu-btn alt" onclick="info.style.display=\'none\'">FECHAR</button>':'<div class="card"><b>Configurações rápidas</b><div class="muted">A música e os efeitos sonoros começam no primeiro toque. Você pode desligá-los pelo menu dentro do jogo.</div></div><button class="menu-btn alt" onclick="info.style.display=\'none\'">FECHAR</button>'}function initInput(){const c=document.getElementById('mapCanvas');c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false}});c.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>8)drag.moved=true;cam.x=drag.cx+dx;cam.y=drag.cy+dy;clampCamera()});c.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const r=c.getBoundingClientRect(),hit=hitAt((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);if(hit)hit.type==='business'?openBusiness(hit.data):openPanel('map')}drag=null});c.addEventListener('wheel',e=>{e.preventDefault();cam.zoom=Math.max(.7,Math.min(1.65,cam.zoom-(e.deltaY>0?.08:-.08)));clampCamera()},{passive:false});c.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)});c.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch){cam.zoom=Math.max(.7,Math.min(1.65,cam.zoom+(d-pinch)/500));clampCamera();pinch=d}}},{passive:false})}function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();document.querySelectorAll('button').forEach(b=>b.addEventListener('click',playClick,{passive:true}))}function playClick(){if(!audio.sfx)return;try{if(!audioCtx)initAudio();const a=new Audio('ui-click.mp3');a.volume=.35;a.play().catch(()=>{})}catch(e){}}function startAudio(){if(!audio.music||musicTimer)return;try{if(!audioCtx)initAudio();const notes=[261.6,329.6,392,329.6,293.7,349.2,440,349.2];musicTimer=setInterval(()=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.frequency.value=notes[musicStep++%notes.length];g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.035,audioCtx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.3);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.32)},380)}catch(e){}}function showToast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.remove('show'),2200)}function drawMenu(){const c=document.getElementById('menuCanvas'),x=c.getContext('2d');x.fillStyle='#76c6cd';x.fillRect(0,0,700,300);x.fillStyle='#e89b6b';x.beginPath();x.moveTo(0,205);x.lineTo(150,95);x.lineTo(280,183);x.lineTo(410,70);x.lineTo(700,175);x.lineTo(700,300);x.lineTo(0,300);x.fill();for(let i=0;i<5;i++){const xx=110+i*120;x.fillStyle=i%2?'#e6bf5c':'#67aab5';x.beginPath();x.arc(xx,220-i*10,18,0,7);x.fill();x.fillRect(xx-14,238-i*10,28,35)}x.fillStyle='#f7e19b';x.beginPath();x.arc(580,62,35,0,7);x.fill();x.fillStyle='#fff';x.font='bold 18px Arial';x.fillText('BUILD YOUR EMPIRE',22,33)}function drawNavIcons(){document.querySelectorAll('.nav-icon').forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,25,24);x.strokeStyle='#69c9ee';x.lineWidth=2;x.lineCap='round';const i=c.dataset.icon;if(i==='business'){x.strokeRect(4,8,17,12);x.beginPath();x.moveTo(8,8);x.lineTo(9,4);x.lineTo(17,4);x.lineTo(18,8);x.stroke()}if(i==='upgrade'){x.beginPath();x.moveTo(5,19);x.lineTo(12,5);x.lineTo(20,19);x.stroke();x.beginPath();x.moveTo(9,15);x.lineTo(15,15);x.stroke()}if(i==='staff'){x.beginPath();x.arc(9,8,4,0,7);x.arc(17,10,3,0,7);x.stroke();x.strokeRect(4,14,10,7);x.strokeRect(14,16,8,5)}if(i==='map'){x.strokeRect(4,5,17,15);x.beginPath();x.moveTo(10,5);x.lineTo(10,20);x.moveTo(16,5);x.lineTo(16,20);x.stroke()}if(i==='rank'){x.beginPath();x.moveTo(5,20);x.lineTo(5,8);x.lineTo(20,11);x.lineTo(5,14);x.stroke();x.beginPath();x.moveTo(5,20);x.lineTo(21,20);x.stroke()}if(i==='menu'){x.beginPath();x.moveTo(5,7);x.lineTo(20,7);x.moveTo(5,12);x.lineTo(20,12);x.moveTo(5,17);x.lineTo(20,17);x.stroke()}})}function openGame(){document.getElementById('mainMenu').style.display='none';render();initAudio();initInput();startAudio()}document.getElementById('sheetBack').addEventListener('click',e=>{if(e.target.id==='sheetBack')closeSheet()});window.addEventListener('beforeunload',save);boot();setInterval(tick,1000);
